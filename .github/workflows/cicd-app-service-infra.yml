name: cicd-app-service-infra

on:
  push:
    paths:
      - '.github/workflows/cicd-app-service-infra.yml'
      - 'scripts/bootstrap-vnet-runner.sh'
      - 'scripts/templates/app-service-*.bicep'
      - 'scripts/templates/components/*.bicep'
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        description: Deploy to Azure after validation
        default: false
      check_credentials:
        type: boolean
        description: Test the configured Azure login without deploying
        default: false
      run_cleanup:
        type: boolean
        description: Delete the app resource group and purge its Key Vault first (deploy only)
        default: false
      deployment_environment:
        type: choice
        description: Deployment environment (VNET requires a private GitHub repository)
        required: true
        options:
          - CLASSIC
          - MANAGED_IDENTITIES
          - VNET

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AZURE_BICEP_USE_BINARY_FROM_PATH: 'false'
    steps:
      - name: Reject unsupported deployment modes
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment_environment }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          case "$DEPLOYMENT_ENVIRONMENT" in
            CLASSIC|MANAGED_IDENTITIES) ;;
            VNET)
              if [[ "$REPOSITORY_PRIVATE" != 'true' ]]; then
                echo "::error::VNET provisions a privileged self-hosted runner and must be deployed from a private repository."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported deployment environment."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compile App Service Bicep templates
        shell: bash
        working-directory: ./scripts/templates
        run: |
          az bicep install --version v0.48.1
          for template in app-service-classic.bicep app-service-mi.bicep app-service-mi-vnet.bicep components/rg.bicep components/logs.bicep; do
            echo "Compiling $template"
            az bicep build --file "$template" --stdout > /dev/null
          done

  check_azure_credentials:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.check_credentials && !inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: APP-SERVICE
    permissions:
      id-token: write
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: ${{ vars.AZURE_CLIENT_ID != '' }}
          creds: ${{ !vars.AZURE_CLIENT_ID && !vars.AZURE_TENANT_ID && secrets.AZURE_CREDENTIALS || '' }}

      - name: Verify read access to the configured subscription
        env:
          SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az account set --subscription "$SUBSCRIPTION"
          az group list --output none

  cleanup_if_requested:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: APP-SERVICE
    steps:
      - name: Azure login
        if: inputs.run_cleanup
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set default Azure subscription
        if: inputs.run_cleanup
        run: az account set -s ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Remove the resource group
        if: inputs.run_cleanup
        run: |
          RG_EXISTS=$(az group exists --name ${{ secrets.AZURE_RESOURCE_GROUP }} --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }})
          if [[ "$RG_EXISTS" == "true" ]]; then
             echo "Deleting the Todo App app resource group"
             az group delete --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} --yes
          fi

  deploy_log_analytics_if_needed:
    # Having this as a separte Job, as there are many situations where Log Analytics
    # workspace would be outside of the current subscription
    needs: [cleanup_if_requested]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: APP-SERVICE
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./scripts
    steps:
      - uses: actions/checkout@v3

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_CLIENT_ID && secrets.AZURE_SUBSCRIPTION_ID || '' }}
          creds: ${{ !vars.AZURE_CLIENT_ID && !vars.AZURE_TENANT_ID && secrets.AZURE_CREDENTIALS || '' }}

      - name: Set default Azure subscription
        run: az account set -s ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check the resource group exists
        id: logs_rg_exists
        run: |
          LOGS_RG_EXISTS=$(az group exists --name ${{ secrets.AZURE_LOG_ANALYTICS_WRKSPC_RESOURCE_GROUP }} --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }})
          printf 'LOGS_RG_EXISTS=%s\n' "$LOGS_RG_EXISTS" >> "$GITHUB_OUTPUT"

      - name: Create Logs Workspace Azure resource group
        if: steps.logs_rg_exists.outputs.LOGS_RG_EXISTS == 'false'
        run: |
          az deployment sub create \
           --location ${{ secrets.AZURE_LOCATION }} \
           --template-file ./templates/components/rg.bicep \
           --parameters name=${{ secrets.AZURE_LOG_ANALYTICS_WRKSPC_RESOURCE_GROUP }} location=${{ secrets.AZURE_LOCATION }} resourceTags="${{ secrets.AZURE_RESOURCE_TAGS }}"

      - name: Check whether the Log Analytics workspace exists
        id: logs_workspace
        env:
          LOGS_RG: ${{ secrets.AZURE_LOG_ANALYTICS_WRKSPC_RESOURCE_GROUP }}
          LOGS_WORKSPACE: ${{ secrets.AZURE_LOG_ANALYTICS_WRKSPC_NAME }}
        run: |
          workspaceNames=$(az monitor log-analytics workspace list --resource-group "$LOGS_RG" --query '[].name' -o tsv)
          if grep -Fxiq -- "$LOGS_WORKSPACE" <<< "$workspaceNames"; then
            echo 'EXISTS=true' >> "$GITHUB_OUTPUT"
          else
            echo 'EXISTS=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Log Workspace
        if: steps.logs_workspace.outputs.EXISTS == 'false'
        run: |
          az deployment group create --resource-group ${{ secrets.AZURE_LOG_ANALYTICS_WRKSPC_RESOURCE_GROUP }} --template-file ./templates/components/logs.bicep \
                        --parameters location=${{ secrets.AZURE_LOCATION }}  \
                                     logAnalyticsWorkspaceName=${{ secrets.AZURE_LOG_ANALYTICS_WRKSPC_NAME }}

  deploy_infra:
    needs: [deploy_log_analytics_if_needed]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: APP-SERVICE
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./scripts
    env:
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v3

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_CLIENT_ID && secrets.AZURE_SUBSCRIPTION_ID || '' }}
          creds: ${{ !vars.AZURE_CLIENT_ID && !vars.AZURE_TENANT_ID && secrets.AZURE_CREDENTIALS || '' }}
      
      - name: Set default Azure subscription
        run: az account set -s ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Purge deleted KV if found
        if: inputs.run_cleanup
        run: |
          kvDeletedQuery="[?name == '${{secrets.AZURE_KEY_VAULT_NAME}}'].id"
          kvDeletedExists=`az keyvault list-deleted --query "$kvDeletedQuery" -o tsv`
          if [[ ! -z "$kvDeletedExists" ]]; then
            echo "Purging the deleted Key Vault as requested."
            az keyvault purge -l ${{secrets.AZURE_LOCATION}} -n ${{secrets.AZURE_KEY_VAULT_NAME}}
          fi

      - name: Process input variables
        id: input_vars
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment_environment }}
        run: |
          printf 'DEPLOYMENT_ENVIRONMENT=%s\n' "$DEPLOYMENT_ENVIRONMENT" >> "$GITHUB_OUTPUT"
      
      - name: Create Azure resource group
        run: |
          az deployment sub create \
           --location ${{ secrets.AZURE_LOCATION }} \
           --template-file ./templates/components/rg.bicep \
           --parameters name=${{ secrets.AZURE_RESOURCE_GROUP }} location=${{ secrets.AZURE_LOCATION }} resourceTags="${{ secrets.AZURE_RESOURCE_TAGS }}"

      - name: Initialize deployment variables
        id: vars
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ steps.input_vars.outputs.DEPLOYMENT_ENVIRONMENT }}
          DBA_GROUP_NAME: ${{ secrets.AZURE_DBA_GROUP_NAME }}
          DBA_GROUP_ID: ${{ vars.AZURE_DBA_GROUP_ID }}
          DB_ADMIN_PASSWORD: ${{ secrets.AZURE_DB_ADMIN_PASSWORD }}
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          DB_SERVER: ${{ secrets.AZURE_DB_SERVER_NAME }}
          APP_NAME: ${{ secrets.AZURE_APP_NAME }}
          VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
        run: |
          if [[ "$DEPLOYMENT_ENVIRONMENT" != 'CLASSIC' && -z "$DBA_GROUP_NAME" ]]; then
            echo "::error::Set AZURE_DBA_GROUP_NAME for MANAGED_IDENTITIES and VNET deployments."
            exit 1
          fi

          if [[ "$DEPLOYMENT_ENVIRONMENT" != 'CLASSIC' ]]; then
            dbaGroupId=$DBA_GROUP_ID
            if [[ -z "$dbaGroupId" ]]; then
              dbaGroupId=$(az ad group show --group "$DBA_GROUP_NAME" --query id -o tsv)
            fi
            if [[ ! "$dbaGroupId" =~ ^[[:xdigit:]]{8}(-[[:xdigit:]]{4}){3}-[[:xdigit:]]{12}$ ]]; then
              echo "::error::Set AZURE_DBA_GROUP_ID to the configured DBA group's Entra object ID."
              exit 1
            fi
            printf 'AZURE_DBA_GROUP_ID=%s\n' "$dbaGroupId" >> "$GITHUB_OUTPUT"
          fi

          dbAppUserName=${APP_NAME//-/_}
          if [[ ${#dbAppUserName} -gt 55 ]]; then
            echo "::error::App Service name is too long to derive the PostgreSQL roles."
            exit 1
          fi
          printf 'DB_APP_USER_NAME=%s\n' "$dbAppUserName" >> "$GITHUB_OUTPUT"
          if [[ "$DEPLOYMENT_ENVIRONMENT" == 'VNET' ]]; then
            # Only ARM provisioning runs on the hosted runner for the private database.
            exit 0
          fi

          : "${DB_ADMIN_PASSWORD:?Set AZURE_DB_ADMIN_PASSWORD for Classic and Managed Identities.}"
          dbAdminName=$(az postgres flexible-server list --resource-group "$RESOURCE_GROUP" \
            --query "[?name=='$DB_SERVER'].administratorLogin | [0]" -o tsv)
          
          if [[ -z "$dbAdminName" ]]; then
            echo "This is a new deployment, generating a new admin name"
            dbAdminName="a`openssl rand -hex 5`"
          fi
          echo "Admin name: $dbAdminName"
          printf 'DB_ADMIN_NAME=%s\n' "$dbAdminName" >> "$GITHUB_OUTPUT"

          
          echo "App user name: $dbAppUserName"

          dbStagingAppUserName="${dbAppUserName}_staging"
          printf 'DB_STAGING_APP_USER_NAME=%s\n' "$dbStagingAppUserName" >> "$GITHUB_OUTPUT"
          echo "Staging app user name: $dbStagingAppUserName"         

          if [[ "$DEPLOYMENT_ENVIRONMENT" == 'CLASSIC' ]]; then
            vaults=$(az keyvault list --resource-group "$RESOURCE_GROUP" --query '[].name' -o tsv)
            existing_secrets=
            if grep -Fxiq -- "$VAULT_NAME" <<< "$vaults"; then
              existing_secrets=$(az keyvault secret list --vault-name "$VAULT_NAME" --query '[].name' -o tsv)
            fi
            password_for() {
              if grep -Fxiq -- "$1" <<< "$existing_secrets"; then
                az keyvault secret show --vault-name "$VAULT_NAME" --name "$1" --query value -o tsv
              else
                printf '%s#@\n' "$(openssl rand -hex 25)"
              fi
            }
            app_password=$(password_for SPRING-DATASOURCE-PASSWORD)
            staging_password=$(password_for SPRING-DATASOURCE-PASSWORD-STAGING)
            echo "::add-mask::$app_password"
            echo "::add-mask::$staging_password"
            printf 'DB_APP_USER_PASSWORD=%s\nDB_STAGING_APP_USER_PASSWORD=%s\n' "$app_password" "$staging_password" >> "$GITHUB_OUTPUT"
            echo 'DB_AAD_INTEGRATION=false' >> "$GITHUB_OUTPUT"
          else
            echo 'DB_AAD_INTEGRATION=true' >> "$GITHUB_OUTPUT"
          fi

          export appName=`az webapp list -g ${{secrets.AZURE_RESOURCE_GROUP}} --query "[?name=='${{secrets.AZURE_APP_NAME}}'].name" -o tsv`
          if [[ -z "$appName" ]]; then
            printf '%s\n' 'HEALTH_CHECK_PATH=' 'APP_CLIENT_ID=' 'STAGING_APP_CLIENT_ID=' >> "$GITHUB_OUTPUT"
          else
            healthCheckPath=`az webapp show -g ${{secrets.AZURE_RESOURCE_GROUP}} -n "${{secrets.AZURE_APP_NAME}}" --query "siteConfig.healthCheckPath" -o tsv`
            printf 'HEALTH_CHECK_PATH=%s\n' "$healthCheckPath" >> "$GITHUB_OUTPUT"
            appClientId=`az ad sp list --display-name "${{secrets.AZURE_APP_NAME}}" --query "[?displayName=='${{secrets.AZURE_APP_NAME}}'].appId" --out tsv`
            printf 'APP_CLIENT_ID=%s\n' "$appClientId" >> "$GITHUB_OUTPUT"
            stagingAppClientId=`az ad sp list --display-name "${{secrets.AZURE_APP_NAME}}/slots/staging" --query "[?displayName=='${{secrets.AZURE_APP_NAME}}/slots/staging'].appId" --out tsv`
            printf 'STAGING_APP_CLIENT_ID=%s\n' "$stagingAppClientId" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Deploy Azure resources (AAD Integration)
        if: steps.input_vars.outputs.DEPLOYMENT_ENVIRONMENT == 'MANAGED_IDENTITIES'
        env:
          DB_ADMIN_PASSWORD: ${{ secrets.AZURE_DB_ADMIN_PASSWORD }}
        run: |
          echo "Deploying with the following parameters:"
          echo "App service name: '${{secrets.AZURE_APP_NAME}}'"
          echo "App port: '${{secrets.AZURE_APP_PORT}}'"

          az deployment group create --resource-group ${{secrets.AZURE_RESOURCE_GROUP}} --template-file ./templates/app-service-mi.bicep \
                        --parameters location=${{secrets.AZURE_LOCATION}}  \
                                      logAnalyticsWorkspaceName=${{secrets.AZURE_LOG_ANALYTICS_WRKSPC_NAME}}  \
                                      logAnalyticsWorkspaceRG=${{secrets.AZURE_LOG_ANALYTICS_WRKSPC_RESOURCE_GROUP}} \
                                      keyVaultName=${{secrets.AZURE_KEY_VAULT_NAME}}  \
                                      appInsightsName=${{secrets.AZURE_APP_INSIGHTS_NAME}}  \
                                      dbServerName=${{secrets.AZURE_DB_SERVER_NAME}} \
                                      dbName=${{secrets.AZURE_DB_NAME}} \
                                      dbAdminName=${{steps.vars.outputs.DB_ADMIN_NAME}} \
                                      dbAdminPassword="$DB_ADMIN_PASSWORD" \
                                      dbUserName=${{steps.vars.outputs.DB_APP_USER_NAME}} \
                                      dbStagingUserName=${{steps.vars.outputs.DB_STAGING_APP_USER_NAME}} \
                                      appClientId="${{steps.vars.outputs.APP_CLIENT_ID}}" \
                                      stagingAppClientId="${{steps.vars.outputs.STAGING_APP_CLIENT_ID}}" \
                                      appServiceName=${{secrets.AZURE_APP_NAME}} \
                                      appServicePort=${{secrets.AZURE_APP_PORT}} \
                                      healthCheckPath="${{steps.vars.outputs.HEALTH_CHECK_PATH}}"
      
      - name: Deploy private PostgreSQL and App Service (VNET)
        if: inputs.deployment_environment == 'VNET'
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          LOCATION: ${{ secrets.AZURE_LOCATION }}
          LOGS_WORKSPACE: ${{ secrets.AZURE_LOG_ANALYTICS_WRKSPC_NAME }}
          LOGS_RG: ${{ secrets.AZURE_LOG_ANALYTICS_WRKSPC_RESOURCE_GROUP }}
          VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
          INSIGHTS_NAME: ${{ secrets.AZURE_APP_INSIGHTS_NAME }}
          DB_SERVER: ${{ secrets.AZURE_DB_SERVER_NAME }}
          DB_NAME: ${{ secrets.AZURE_DB_NAME }}
          DBA_GROUP_NAME: ${{ secrets.AZURE_DBA_GROUP_NAME }}
          DBA_GROUP_ID: ${{ steps.vars.outputs.AZURE_DBA_GROUP_ID }}
          DB_APP_USER: ${{ steps.vars.outputs.DB_APP_USER_NAME }}
          APP_NAME: ${{ secrets.AZURE_APP_NAME }}
          APP_PORT: ${{ secrets.AZURE_APP_PORT }}
          SSH_PUBLIC_KEY: ${{ vars.AZURE_RUNNER_SSH_PUBLIC_KEY || secrets.AZURE_RUNNER_SSH_PUBLIC_KEY }}
          GH_TOKEN: ${{ secrets.GH_RUNNER_ADMIN_TOKEN }}
        run: |
          : "${SSH_PUBLIC_KEY:?Set AZURE_RUNNER_SSH_PUBLIC_KEY.}" "${GH_TOKEN:?Set GH_RUNNER_ADMIN_TOKEN for this private repository.}"
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" == 'true' ]]
          runner_name=$(az deployment group create --resource-group "$RESOURCE_GROUP" --mode Incremental \
            --template-file ./templates/app-service-mi-vnet.bicep --query properties.outputs.githubRunnerName.value -o tsv \
            --parameters location="$LOCATION" logAnalyticsWorkspaceName="$LOGS_WORKSPACE" logAnalyticsWorkspaceRG="$LOGS_RG" \
              keyVaultName="$VAULT_NAME" appInsightsName="$INSIGHTS_NAME" dbServerName="$DB_SERVER" dbName="$DB_NAME" \
              dbAdminName="$DBA_GROUP_NAME" dbAdminObjectId="$DBA_GROUP_ID" dbUserName="$DB_APP_USER" \
              appServiceName="$APP_NAME" appServicePort="$APP_PORT" runnerAdminSshPublicKey="$SSH_PUBLIC_KEY" \
              healthCheckPath=/actuator/health/liveness)
          [[ "$runner_name" =~ ^tinyjava-[a-z0-9]+$ ]]
          registration_token=$(gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runners/registration-token" --jq .token)
          : "${registration_token:?GitHub did not return a registration token.}"
          echo "::add-mask::$registration_token"
          # Only the one-hour registration token goes to the VM, through a protected Run Command parameter.
          az vm run-command create --resource-group "$RESOURCE_GROUP" --vm-name "$runner_name" \
            --run-command-name configure-github-runner --location "$LOCATION" --timeout-in-seconds 900 \
            --script "$(cat ./bootstrap-vnet-runner.sh)" \
            --parameters "RUNNER_NAME=$runner_name" "RUNNER_REPOSITORY=$GITHUB_REPOSITORY" \
              RUNNER_VERSION=2.338.2 RUNNER_SHA256=baebf204307bac6193480852732f0aba2ae97b6c5597c244f4d5558390147c40 \
            --protected-parameters "RUNNER_REGISTRATION_TOKEN=$registration_token" --output none
          unset registration_token
          run_command_id=$(az vm run-command show --resource-group "$RESOURCE_GROUP" --vm-name "$runner_name" \
            --run-command-name configure-github-runner --query id -o tsv)
          exit_code=$(az rest --method get \
            --url "${run_command_id}?api-version=2024-07-01&\$expand=instanceView" \
            --query properties.instanceView.exitCode -o tsv)
          if [[ "$exit_code" != '0' ]]; then
            echo "::error::Bootstrapping the private runner failed. Check the VM Run Command status."
            exit 1
          fi
          for attempt in {1..18}; do
            online=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" \
              --jq ".runners[] | select(.name == \"$runner_name\" and .status == \"online\") | .name")
            if [[ "$online" == "$runner_name" ]]; then
              break
            fi
            if [[ "$attempt" -eq 18 ]]; then
              echo "::error::GitHub did not report the private runner online."
              exit 1
            fi
            sleep 5
          done
          printf 'VNET infrastructure and runner `%s` are ready. Database setup runs during code deployment.\n' "$runner_name" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve managed identities
        if: steps.vars.outputs.DB_AAD_INTEGRATION == 'true'
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ secrets.AZURE_APP_NAME }}
          VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
        run: |
          appObjectId=$(az webapp identity show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query principalId -o tsv)
          stagingObjectId=$(az webapp identity show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --slot staging --query principalId -o tsv)
          if [[ -z "$appObjectId" || -z "$stagingObjectId" ]]; then
            echo "::error::Both App Service slots must have system-assigned managed identities."
            exit 1
          fi
          appClientId=$(az ad sp show --id "$appObjectId" --query appId -o tsv)
          stagingClientId=$(az ad sp show --id "$stagingObjectId" --query appId -o tsv)
          az keyvault secret set --vault-name "$VAULT_NAME" --name SPRING-DATASOURCE-APP-CLIENT-ID --value "$appClientId" --output none
          az keyvault secret set --vault-name "$VAULT_NAME" --name SPRING-DATASOURCE-APP-CLIENT-ID-STAGING --value "$stagingClientId" --output none

      - name: Deploy Azure resources (NO AAD Integration)
        if: steps.input_vars.outputs.DEPLOYMENT_ENVIRONMENT == 'CLASSIC'
        env:
          DB_ADMIN_PASSWORD: ${{ secrets.AZURE_DB_ADMIN_PASSWORD }}
          APP_PASSWORD: ${{ steps.vars.outputs.DB_APP_USER_PASSWORD }}
          STAGING_PASSWORD: ${{ steps.vars.outputs.DB_STAGING_APP_USER_PASSWORD }}
        run: |
          echo "Deploying with the following parameters:"
          echo "App service name: '${{secrets.AZURE_APP_NAME}}'"
          echo "App port: '${{secrets.AZURE_APP_PORT}}'"

          az deployment group create --resource-group ${{secrets.AZURE_RESOURCE_GROUP}} --template-file ./templates/app-service-classic.bicep \
                        --parameters location=${{secrets.AZURE_LOCATION}}  \
                                     logAnalyticsWorkspaceName=${{secrets.AZURE_LOG_ANALYTICS_WRKSPC_NAME}}  \
                                     logAnalyticsWorkspaceRG=${{secrets.AZURE_LOG_ANALYTICS_WRKSPC_RESOURCE_GROUP}} \
                                     keyVaultName=${{secrets.AZURE_KEY_VAULT_NAME}}  \
                                     appInsightsName=${{secrets.AZURE_APP_INSIGHTS_NAME}}  \
                                     dbServerName=${{secrets.AZURE_DB_SERVER_NAME}} \
                                     dbName=${{secrets.AZURE_DB_NAME}} \
                                     dbAdminName=${{steps.vars.outputs.DB_ADMIN_NAME}} \
                                     dbAdminPassword="$DB_ADMIN_PASSWORD" \
                                     dbUserName=${{steps.vars.outputs.DB_APP_USER_NAME}} \
                                     dbUserPassword="$APP_PASSWORD" \
                                     dbStagingUserName=${{steps.vars.outputs.DB_STAGING_APP_USER_NAME}} \
                                     dbStagingUserPassword="$STAGING_PASSWORD" \
                                     appServiceName=${{secrets.AZURE_APP_NAME}} \
                                     appServicePort=${{secrets.AZURE_APP_PORT}} \
                                     healthCheckPath="${{steps.vars.outputs.HEALTH_CHECK_PATH}}"

      - name: Set-up DB AAD Integration
        if: (steps.vars.outputs.DB_AAD_INTEGRATION == 'true')
        run: |
          dbAdminName=`az postgres flexible-server microsoft-entra-admin list -g ${{ secrets.AZURE_RESOURCE_GROUP }} -s ${{ secrets.AZURE_DB_SERVER_NAME }} --query "[?principalName == '${{secrets.AZURE_DBA_GROUP_NAME}}'].principalName" -o tsv`
          if [[ -z "$dbAdminName" ]]; then
            echo "Setting AAD DB Admin Group"
            az postgres flexible-server microsoft-entra-admin create -s ${{ secrets.AZURE_DB_SERVER_NAME }} -g ${{ secrets.AZURE_RESOURCE_GROUP }} --object-id ${{ steps.vars.outputs.AZURE_DBA_GROUP_ID }} --display-name "${{secrets.AZURE_DBA_GROUP_NAME}}" -t Group
          fi